<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animación interactiva</title>

    <!-- Estilos para normalizar los elementos HTML -->
    <link rel="stylesheet" href="CSS/reset.css">

    <!-- Estilos personalizados del proyecto -->
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="../../../../js/menu-ui-lab.js" defer></script>
    <link rel="icon" type="image/png" href="../../../../recursos/img/icono-ui-02-02.png">
</head>
<body>

    <main class="contenedor">
        <h1>Animación final</h1>

        <!-- Área donde se muestran las animaciones -->
        <canvas id="canvas" width="600" height="600"></canvas>

        <!-- Botones para seleccionar las acciones -->
        <section class="acciones">
            <h2>Selecciona una acción</h2>
            <button id="btn-dia">Día</button>
            <button id="btn-noche">Noche</button>
            <button id="btn-eclipse">Eclipse</button>
            <button id="btn-nublado">Nublado</button>
        </section>
    </main>

    <script src="JS/main.js"></script>
</body>
</html>
