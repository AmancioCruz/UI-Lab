<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luigi's Picture Poker - Nintendo DS Classic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-2 text-white overflow-x-hidden">

  <!-- CHASSIS NINTENDO DS -->
  <div class="w-full max-w-md bg-gradient-to-b from-gray-400 via-gray-300 to-gray-500 rounded-3xl p-4 shadow-2xl border-4 border-gray-600 flex flex-col items-center gap-3 relative">
    
    <!-- BRANDING DS -->
    <div class="absolute top-2 left-6 text-[8px] text-gray-700 tracking-widest font-sans font-bold">NINTENDO DS</div>
    <div class="absolute top-2 right-6 flex gap-1.5 items-center">
      <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
      <div class="w-2 h-2 rounded-full bg-gray-400"></div>
    </div>

    <!-- PANTALLA SUPERIOR -->
    <div class="w-full h-64 ds-screen rounded-xl border-4 border-gray-800 relative overflow-hidden flex flex-col items-center justify-between p-3">
      
      <!-- ESQUINA SUPERIOR IZQUIERDA: TABLA DE JERARQUÍA -->
      <div class="absolute top-2 left-2 bg-black/75 border border-amber-400/60 rounded p-1.5 text-[7px] leading-relaxed z-10">
        <div class="text-amber-300 font-bold mb-0.5 border-b border-amber-400/40 pb-0.5">JERARQUÍA</div>
        <div class="flex justify-between gap-2 text-white"><span>5x:</span><span class="text-yellow-300">16x</span></div>
        <div class="flex justify-between gap-2 text-white"><span>Póker:</span><span class="text-yellow-300">8x</span></div>
        <div class="flex justify-between gap-2 text-white"><span>Full:</span><span class="text-yellow-300">6x</span></div>
        <div class="flex justify-between gap-2 text-white"><span>Trío:</span><span class="text-yellow-300">4x</span></div>
        <div class="flex justify-between gap-2 text-white"><span>2 Par:</span><span class="text-yellow-300">3x</span></div>
        <div class="flex justify-between gap-2 text-white"><span>1 Par:</span><span class="text-yellow-300">2x</span></div>
        <div class="text-[6px] text-emerald-300 mt-1 border-t border-gray-600 pt-0.5">⭐>🍄>🔥>👨🏻‍🌾>👨🏻>☁️</div>
      </div>

      <!-- ESQUINA INFERIOR DERECHA: RACHA DE VICTORIAS VERTICAL -->
      <div class="absolute bottom-12 right-2.5 bg-black/70 border border-yellow-500/50 rounded-lg px-1.5 py-2 flex flex-col items-center gap-1.5 z-10">
        <div class="text-[6px] text-yellow-400 font-bold uppercase tracking-tighter">RACHA</div>
        <div id="star-5" class="text-xs star-off transition-all duration-300">⭐</div>
        <div id="star-4" class="text-xs star-off transition-all duration-300">⭐</div>
        <div id="star-3" class="text-xs star-off transition-all duration-300">⭐</div>
        <div id="star-2" class="text-xs star-off transition-all duration-300">⭐</div>
        <div id="star-1" class="text-xs star-off transition-all duration-300">⭐</div>
      </div>

      <!-- CENTRO: LUIGI SVG ANIMADO -->
      <div class="w-full h-full flex flex-col items-center justify-center pt-2">
        <div class="relative w-28 h-28">
          <svg id="luigi-svg" viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
            <!-- Gorra -->
            <path d="M 40,80 Q 100,20 160,80 Q 170,85 160,95 L 40,95 Q 30,85 40,80 Z" fill="#15803d"/>
            <path d="M 45,80 Q 100,30 155,80 Z" fill="#22c55e"/>
            <!-- Emblema Gorra -->
            <circle cx="100" cy="65" r="16" fill="#ffffff"/>
            <text x="100" y="73" font-size="22" font-weight="bold" fill="#15803d" text-anchor="middle" font-family="sans-serif">L</text>
            <!-- Cara -->
            <ellipse cx="100" cy="120" rx="45" ry="40" fill="#fbcfe8"/>
            <!-- Orejas -->
            <circle cx="55" cy="120" r="12" fill="#fbcfe8"/>
            <circle cx="145" cy="120" r="12" fill="#fbcfe8"/>
            <!-- Ojos base -->
            <ellipse cx="80" cy="110" rx="8" ry="12" fill="#ffffff" id="eye-left-bg"/>
            <ellipse cx="120" cy="110" rx="8" ry="12" fill="#ffffff" id="eye-right-bg"/>
            <!-- Pupilas -->
            <circle cx="82" cy="110" r="5" fill="#1d4ed8" id="pupil-left"/>
            <circle cx="122" cy="110" r="5" fill="#1d4ed8" id="pupil-right"/>
            <!-- Cejas -->
            <path id="eyebrow-left" d="M 70,95 Q 80,90 90,95" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path id="eyebrow-right" d="M 110,95 Q 120,90 130,95" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <!-- Nariz -->
            <ellipse cx="100" cy="118" rx="16" ry="12" fill="#f43f5e"/>
            <!-- Bigote -->
            <path d="M 65,130 Q 80,120 100,132 Q 120,120 135,130 Q 145,145 125,142 Q 100,148 75,142 Q 55,145 65,130 Z" fill="#1e293b"/>
            <!-- Boca -->
            <path id="luigi-mouth" d="M 90,148 Q 100,158 110,148" stroke="#1e293b" stroke-width="3" fill="#991b1b" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- BOCADILLO DE DIÁLOGO -->
        <div class="speech-bubble relative bg-white text-gray-900 border-2 border-black rounded-xl px-3 py-1.5 text-[9px] text-center font-bold max-w-[85%] shadow-md mt-1">
          <span id="luigi-dialog">¡Hola! ¿Listo para jugar al Picture Poker?</span>
        </div>
      </div>
    </div>

    <!-- HINGE / BISAGRA DS -->
    <div class="w-full h-4 bg-gradient-to-r from-gray-600 via-gray-400 to-gray-600 rounded-md border-y border-gray-700 flex justify-between items-center px-8">
      <div class="w-8 h-1 bg-gray-800 rounded"></div>
      <div class="w-8 h-1 bg-gray-800 rounded"></div>
    </div>

    <!-- PANTALLA INFERIOR (TÁCTIL) -->
    <div class="w-full h-80 ds-screen rounded-xl border-4 border-gray-800 relative flex flex-col justify-between p-2">
      
      <!-- BARAJA DE LUIGI -->
      <div class="w-full bg-black/40 rounded-lg p-2 border border-green-800/60">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[8px] text-green-300 font-bold uppercase tracking-wider">Cartas de Luigi</span>
          <span id="luigi-hand-title" class="text-[8px] text-yellow-300 font-bold">???</span>
        </div>
        <div id="luigi-cards" class="flex justify-around items-center gap-1 min-h-[64px]">
          <!-- Se cargan dinámicamente -->
        </div>
      </div>

      <!-- BARAJA DEL JUGADOR -->
      <div class="w-full bg-black/40 rounded-lg p-2 border border-green-800/60">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[8px] text-yellow-300 font-bold uppercase tracking-wider">Tus Cartas (Toca para HOLD)</span>
          <span id="player-hand-title" class="text-[8px] text-green-300 font-bold">---</span>
        </div>
        <div id="player-cards" class="flex justify-around items-center gap-1 min-h-[64px]">
          <!-- Se cargan dinámicamente -->
        </div>
      </div>

      <!-- PANEL DE CONTROL & APUESTAS -->
      <div class="w-full bg-gray-900/90 rounded-lg p-2 border border-gray-700 flex flex-col gap-2">
        
        <!-- ESTADO Y MONEDAS -->
        <div class="flex justify-between items-center text-[9px]">
          <div class="flex items-center gap-1">
            <span class="text-yellow-400 text-sm">🪙</span>
            <span>MONEDAS: <span id="coins-display" class="text-yellow-300">10</span></span>
          </div>
          <div class="flex items-center gap-1">
            <span>APUESTA: <span id="bet-display" class="text-yellow-300">1</span></span>
          </div>
        </div>

        <!-- BOTONES DE ACCIÓN Y APUESTA -->
        <div class="flex gap-2 items-center">
          
          <!-- CONTROLES DE APUESTA -->
          <div id="bet-controls" class="flex gap-1">
            <button id="btn-sub-bet" class="bg-red-700 hover:bg-red-600 text-white border border-red-900 rounded px-2 py-1 text-xs font-bold active:translate-y-0.5">-</button>
            <button id="btn-add-bet" class="bg-green-700 hover:bg-green-600 text-white border border-green-900 rounded px-2 py-1 text-xs font-bold active:translate-y-0.5">+</button>
          </div>

          <!-- BOTÓN PRINCIPAL -->
          <button id="btn-action" class="flex-1 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-gray-950 font-bold border-2 border-yellow-300 rounded-lg py-2 text-[10px] shadow-lg active:translate-y-0.5 tracking-wider">
            APOSTAR
          </button>
        </div>

      </div>

    </div>

  </div>

  <script src="JS/script.js"></script>
</body>
</html>
